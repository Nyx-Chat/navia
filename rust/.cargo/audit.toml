# Security audit configuration for navia
# Last updated: 2026-11-02

[advisories]
# List of security advisories to ignore
ignore = [
    # Critical vulnerabilities from askar-crypto 0.2.5 (via didcomm 0.4.1)
    "RUSTSEC-2024-0344", # curve25519-dalek timing vulnerability
    "RUSTSEC-2022-0093", # ed25519-dalek double public key signing attack
    
    # Warnings for unmaintained/renamed crates
    "RUSTSEC-2023-0037", # xsalsa20poly1305 renamed to crypto_secretbox
    
    # Other transitive dependency issues with no fixes
    "RUSTSEC-2022-0040", # owning_ref soundness issues
    "RUSTSEC-2023-0071", # rsa Marvin attack
    "RUSTSEC-2024-0388", # derivative unmaintained
    "RUSTSEC-2024-0436", # paste unmaintained
    "RUSTSEC-2024-0370", # proc-macro-error unmaintained
    "RUSTSEC-2021-0127", # serde_cbor unmaintained

    # Transitive, no fixed release on the pinned line (2026-09-28). rustls 0.21 and
    # hyper 0.14 arrive through ssi 0.12 (did-ion / did-tz / did-web) under
    # affinidi-did-resolver-cache-sdk 0.6.5 and reqwest 0.11; the fixes exist only in
    # rustls-webpki 0.103 and h2 0.4, which the rest of the tree already uses. Drop
    # these entries when the resolver moves off ssi 0.12.
    "RUSTSEC-2026-0104", # rustls-webpki 0.101: CRL parsing panic
    "RUSTSEC-2026-0099", # rustls-webpki 0.101: wildcard name constraints
    "RUSTSEC-2026-0098", # rustls-webpki 0.101: URI name constraints
    "RUSTSEC-2026-0258", # h2 0.3: unbounded empty DATA frames
    "RUSTSEC-2026-0346", # rustls 0.21: Debug impls expose TLS secrets
    "RUSTSEC-2026-0349", # rustls 0.21: unauthenticated ServerHello downgrade
    "RUSTSEC-2026-0382", # rustls-webpki 0.101: distrusted intermediates accepted
    "RUSTSEC-2026-0381", # webpki-roots 0.25: distrusted emSign intermediates

    # Transitive, no fixed release on the line the tree can use (2026-11-02).
    # crypto-bigint 0.3 (der 0.5 under rsa 0.6 / ssi-jwk) and 0.5 (elliptic-curve
    # 0.13 under askar-crypto, k256 and p256); the fix exists only in 0.7, which
    # needs the RustCrypto 0.14 line. Drop this when askar-crypto and ssi move.
    "RUSTSEC-2026-0387", # crypto-bigint: timing variability in constant-time ops
]
