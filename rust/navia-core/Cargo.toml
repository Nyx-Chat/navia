[package]
name = "navia-core"
version = "1.5.0"
edition = "2021"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[[example]]
name = "message_flow"
path = "../../examples/basic/message_flow.rs"

[[example]]
name = "storage_operations"
path = "../../examples/basic/storage_operations.rs"

[[example]]
name = "error_handling"
path = "../../examples/advanced/error_handling.rs"

[[example]]
name = "storage_traits"
path = "../../examples/advanced/storage_traits.rs"

[[example]]
name = "complete_api"
path = "../../examples/advanced/complete_api.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
uniffi.workspace = true
navia-didcomm.workspace = true
navia-messaging.workspace = true
askar-storage.workspace = true
async-trait.workspace = true
serde_json.workspace = true
serde.workspace = true
did-peer.workspace = true
affinidi-did-resolver-cache-sdk.workspace = true
thiserror.workspace = true
tokio.workspace = true
zeroize.workspace = true
once_cell = "1.21.3"
uuid = { version = "1.17.0", features = ["v4"] }
parking_lot = "0.12.4"


[features]
cli = ["uniffi/cli"]

[dev-dependencies]
tempfile.workspace = true
futures = "0.3.31"
rusty-hook = "0.11.2"

[lib]
crate-type = ["cdylib", "lib"]
