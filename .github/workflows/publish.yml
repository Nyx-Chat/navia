name: Publish Navia Package

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup JDK
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25b
        add-to-path: true
        
    - name: Install cargo-ndk
      run: cargo install cargo-ndk
    
    - name: Extract version from tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: echo "VERSION_NAME=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      
    - name: Set default version
      if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      run: echo "VERSION_NAME=1.0.0-SNAPSHOT" >> $GITHUB_ENV
    
    - name: Build Rust libraries
      run: |
        cd scripts
        ./build-for-android.sh --package
      
    - name: Build and publish AAR
      run: |
        cd android
        ./gradlew publish -PVERSION_NAME=${{ env.VERSION_NAME }}
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}