name: PR Checks

on:
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-*.yml'
      - '.github/workflows/pr-checks.yml'

permissions:
  contents: read

jobs:
  check-dependencies:
    name: Check Dependencies
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for new dependencies
        run: |
          cd rust/navia-core
          
          # Check if Cargo.lock changed
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "Cargo.lock"; then
            echo "Dependencies changed. Running additional checks..."
            
            # Install cargo-license
            cargo install cargo-license
            
            # Check licenses
            cargo license --json > licenses.json
            
            # Check for problematic licenses
            if cat licenses.json | jq -r '.[].license' | grep -E "(GPL|AGPL|CC-BY-NC)" | grep -v "MIT/Apache-2.0"; then
              echo "::error::Found dependencies with potentially incompatible licenses"
              cat licenses.json | jq -r '.[] | select(.license | test("GPL|AGPL|CC-BY-NC")) | "\(.name) - \(.license)"'
              exit 1
            fi
          fi

  check-unsafe:
    name: Check Unsafe Code
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for unsafe code
        run: |
          cd rust/navia-core
          
          # Count unsafe blocks
          UNSAFE_COUNT=$(grep -r "unsafe" --include="*.rs" src/ | wc -l)
          
          if [ $UNSAFE_COUNT -gt 0 ]; then
            echo "::warning::Found $UNSAFE_COUNT uses of 'unsafe' keyword"
            echo "Unsafe code locations:"
            grep -rn "unsafe" --include="*.rs" src/
          fi

  check-todos:
    name: Check TODOs
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for TODOs
        run: |
          cd rust/navia-core
          
          # Find TODOs in code
          TODO_COUNT=$(grep -rE "(TODO|FIXME|HACK|XXX)" --include="*.rs" src/ | wc -l)
          
          if [ $TODO_COUNT -gt 0 ]; then
            echo "::warning::Found $TODO_COUNT TODO/FIXME/HACK comments"
            echo "Please address these before merging:"
            grep -rnE "(TODO|FIXME|HACK|XXX)" --include="*.rs" src/
          fi