name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup JDK
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
    
    - name: Clear cargo cache
      run: |
        rm -rf ~/.cargo/registry/index
        rm -rf ~/.cargo/registry/cache
        rm -rf ~/.cargo/git
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25b
        add-to-path: true
        
    - name: Install cargo-ndk
      run: cargo install cargo-ndk
    
    - name: Debug - Check Cargo.lock
      run: |
        cd rust
        echo "=== Checking Cargo.lock exists ==="
        ls -la Cargo.lock
        echo "=== Checking askar-storage in Cargo.lock ==="
        grep -A2 "askar-storage" Cargo.lock || true
        echo "=== Checking Cargo.toml ==="
        grep -A1 "askar-storage" Cargo.toml || true
    
    - name: Build Rust libraries
      run: |
        cd scripts
        ./build-for-android.sh --package