name: PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read
  pull-requests: read

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # Detect which parts of the codebase changed
  changes:
    name: Detect Changes
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      ios: ${{ steps.changes.outputs.ios }}
      android: ${{ steps.changes.outputs.android }}
      docs: ${{ steps.changes.outputs.docs }}
      workflows: ${{ steps.changes.outputs.workflows }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            rust:
              - 'rust/**'
              - 'scripts/build-for-*.sh'
              - 'scripts/verify-*.sh'
            ios:
              - 'ios/**'
              - 'Navia.podspec'
            android:
              - 'android/**'
            docs:
              - '**/*.md'
              - 'docs/**'
            workflows:
              - '.github/**'

  # Quick checks that should fail fast
  quick-checks:
    name: Quick Checks
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Rust Environment
        uses: ./.github/actions/setup-rust-env
        env:
          GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
        with:
          components: rustfmt, clippy
      
      - name: Check formatting
        run: |
          cd rust/navia-core
          cargo fmt -- --check
      
      - name: Check compilation
        run: |
          cd rust/navia-core
          cargo check --all-features
      
      - name: Run clippy
        run: |
          cd rust/navia-core
          cargo clippy -- -D warnings

  # Rust tests - run in parallel with Android build
  rust-tests:
    name: Rust Tests
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64
    needs: [changes, quick-checks]
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true') && !cancelled() && !failure()
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Rust Environment
        uses: ./.github/actions/setup-rust-env
        env:
          GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      
      - name: Run tests
        run: |
          cd rust/navia-core
          cargo test --all-features
      
      - name: Run doc tests
        run: |
          cd rust/navia-core
          cargo test --doc

  # iOS build - run in parallel with Android build using matrix strategy
  ios-build:
    name: iOS Build (${{ matrix.target }})
    runs-on: macos-15
    needs: [changes, quick-checks]
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ios == 'true' || needs.changes.outputs.workflows == 'true') && !cancelled() && !failure()
    strategy:
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim]
        include:
          - target: aarch64-apple-ios
            sdk: iphoneos
            config: Release-iphoneos
          - target: aarch64-apple-ios-sim
            sdk: iphonesimulator
            config: Release-iphonesimulator
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Rust Environment
        uses: ./.github/actions/setup-rust-env
        env:
          GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
        with:
          targets: ${{ matrix.target }}
      
      - name: Build Rust library for iOS (${{ matrix.target }})
        run: |
          cd rust/navia-core
          cargo build --release --target ${{ matrix.target }}
      
      - name: Build iOS framework (${{ matrix.sdk }})
        run: |
          cd ios
          xcodebuild -project Navia.xcodeproj -scheme Navia -configuration Release -sdk ${{ matrix.sdk }} -arch arm64 -derivedDataPath build/DerivedData BUILD_LIBRARY_FOR_DISTRIBUTION=YES build
      
      - name: Upload iOS artifacts (${{ matrix.target }})
        uses: actions/upload-artifact@v6
        with:
          name: ios-${{ matrix.target }}
          path: |
            rust/target/${{ matrix.target }}/release/libnavia_core.a
            ios/build/DerivedData/Build/Products/${{ matrix.config }}/Navia.framework/
          retention-days: 7

  # Collect iOS artifacts and run tests
  ios-package:
    name: iOS Package & Test
    runs-on: macos-15
    needs: [changes, ios-build]
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ios == 'true' || needs.changes.outputs.workflows == 'true') && !cancelled() && !failure()
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Rust Environment
        uses: ./.github/actions/setup-rust-env
        env:
          GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
        with:
          targets: aarch64-apple-ios-sim
      
      - name: Download iOS artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: ios-*
          path: ./ios-artifacts/
          merge-multiple: true
      
      - name: Setup iOS artifacts structure
        run: |
          # Create directory structure
          mkdir -p rust/target/aarch64-apple-ios/release
          mkdir -p rust/target/aarch64-apple-ios-sim/release
          mkdir -p ios/build/DerivedData/Build/Products/Release-iphoneos
          mkdir -p ios/build/DerivedData/Build/Products/Release-iphonesimulator
          
          # Copy Rust libraries
          find ios-artifacts -name "libnavia_core.a" -path "*aarch64-apple-ios/release*" -exec cp {} rust/target/aarch64-apple-ios/release/ \;
          find ios-artifacts -name "libnavia_core.a" -path "*aarch64-apple-ios-sim/release*" -exec cp {} rust/target/aarch64-apple-ios-sim/release/ \;
          
          # Copy frameworks
          find ios-artifacts -name "Navia.framework" -path "*Release-iphoneos*" -exec cp -r {} ios/build/DerivedData/Build/Products/Release-iphoneos/ \;
          find ios-artifacts -name "Navia.framework" -path "*Release-iphonesimulator*" -exec cp -r {} ios/build/DerivedData/Build/Products/Release-iphonesimulator/ \;
          
          # Verify artifacts
          ls -la rust/target/*/release/
          ls -la ios/build/DerivedData/Build/Products/*/
      
      - name: Upload final iOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ios-build-artifacts
          path: |
            rust/target/aarch64-apple-ios/release/libnavia_core.a
            rust/target/aarch64-apple-ios-sim/release/libnavia_core.a
            ios/build/DerivedData/Build/Products/Release-iphoneos/Navia.framework/
            ios/build/DerivedData/Build/Products/Release-iphonesimulator/Navia.framework/
          retention-days: 7
      
      - name: Run iOS tests
        run: |
          cd ios
          # Pick a simulator this runner has: the first iPhone on the newest iOS
          # runtime the active Xcode can run. The macOS image's simulator set
          # changes, so a hard-coded name/OS pair fails whenever the image does not
          # ship it. The image also installs newer Xcodes whose iOS runtimes the
          # shared simulator service lists as available, while xcodebuild here is
          # the image's default Xcode, which rejects a runtime newer than its SDK's
          # major version; so cap the runtime at that major version.
          SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version) || {
            echo "::error title=No iOS Simulator SDK::The active Xcode ($(xcode-select -p)) has no iphonesimulator SDK, so NaviaTests cannot run."
            exit 1
          }
          SDK_MAJOR=${SDK_VERSION%%.*}
          case "$SDK_MAJOR" in
            ''|*[!0-9]*)
              echo "::error title=Unreadable iOS Simulator SDK version::xcrun reported iphonesimulator SDK version '$SDK_VERSION'."
              exit 1
              ;;
          esac
          SIMULATOR=$(xcrun simctl list devices available -j | jq -r --argjson sdk "$SDK_MAJOR" '
            [ .devices
              | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-[0-9]"))
              | { version: (.key | capture("iOS-(?<v>[0-9-]+)$").v | split("-") | map(tonumber)),
                  iphones: [ .value[] | select(.name | startswith("iPhone")) ] }
              | select(.version[0] <= $sdk)
              | select(.iphones | length > 0) ]
            | sort_by(.version)
            | last
            | if . == null then empty
              else "\(.iphones[0].udid)\t\(.iphones[0].name), iOS \(.version | map(tostring) | join("."))"
              end')
          if [ -z "$SIMULATOR" ]; then
            echo "::error title=No iPhone simulator::This runner has no available iPhone simulator on an iOS ${SDK_MAJOR}.x or older runtime (active Xcode $(xcode-select -p), iphonesimulator SDK ${SDK_VERSION}), so NaviaTests cannot run. Available devices follow."
            xcrun simctl list devices available
            exit 1
          fi
          IFS=$'\t' read -r SIMULATOR_ID SIMULATOR_NAME <<< "$SIMULATOR"
          echo "Running NaviaTests on $SIMULATOR_NAME ($SIMULATOR_ID)"
          xcodebuild -project Navia.xcodeproj -scheme NaviaTests -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$SIMULATOR_ID" test

      # The Navia target's "Build Rust Library" script phase runs
      # scripts/build-for-ios.sh --package, which regenerated ios/Navia/Generated
      # from this commit's Rust source while the tests built. The committed copy
      # has to match it: stale bindings fail at the first FFI call with "UniFFI
      # API checksum mismatch", and a doc-only edit on an export is enough to
      # move its checksum.
      - name: Check the committed Swift bindings are current
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- ios/Navia/Generated)" ]; then
            echo "::error title=Stale Swift bindings::ios/Navia/Generated differs from the bindings this build generated from the Rust source. Regenerate them (scripts/build-for-ios.sh --package) and commit ios/Navia/Generated with the Rust change. The changes follow."
            git status --short --untracked-files=all -- ios/Navia/Generated
            git --no-pager diff --stat -- ios/Navia/Generated
            git --no-pager diff -- ios/Navia/Generated | head -n 200 || true
            exit 1
          fi
          echo "ios/Navia/Generated matches the bindings generated from the Rust source"

  # Android build - run in parallel with iOS build using matrix strategy
  android-build:
    name: Android Build (${{ matrix.arch }})
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64
    needs: [changes, quick-checks]
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.android == 'true' || needs.changes.outputs.workflows == 'true') && !cancelled() && !failure()
    strategy:
      matrix:
        arch: [arm64-v8a, x86_64]
        include:
          - arch: arm64-v8a
            target: aarch64-linux-android
          - arch: x86_64  
            target: x86_64-linux-android
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h
      
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Rust Environment
        uses: ./.github/actions/setup-rust-env
        env:
          GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
        with:
          targets: ${{ matrix.target }}
      
      - name: Setup Android Environment
        uses: ./.github/actions/setup-android-env
      
      # Build tools are included in the NDK
      
      - name: Build Rust libraries for Android (${{ matrix.arch }})
        run: |
          # Kill the annoying RUSTFLAGS that break everything
          unset RUSTFLAGS
          
          # Set up Android NDK environment variables
          export NDK_HOME=$ANDROID_NDK_HOME
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          
          # Set target-specific environment variables
          if [ "${{ matrix.target }}" = "aarch64-linux-android" ]; then
            export CC_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang
            export CXX_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++
            export AR_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
            export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang
            # Set 16KB alignment flags for arm64
            export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=4096 -C link-arg=-Wl,-z,separate-code -C link-arg=-Wl,-z,separate-loadable-segments"
          else
            export CC_x86_64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android33-clang
            export CXX_x86_64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android33-clang++
            export AR_x86_64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
            export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android33-clang
          fi
          
          # Build for specific target
          cd rust/navia-core
          cargo build --release --target ${{ matrix.target }}
          
          # Copy to expected location for packaging
          mkdir -p ../../android/src/main/jniLibs/${{ matrix.arch }}
          cp ../target/${{ matrix.target }}/release/libnavia_core.so ../../android/src/main/jniLibs/${{ matrix.arch }}/
          
      - name: Verify 16KB alignment (${{ matrix.arch }})
        run: |
          echo "Verifying 16KB alignment for ${{ matrix.arch }}..."
          lib="android/src/main/jniLibs/${{ matrix.arch }}/libnavia_core.so"
          if [ -f "$lib" ]; then
            echo "Checking ${{ matrix.arch }}..."
            ./scripts/verify-16kb-alignment.sh "$lib" || {
              echo "Note: Alignment warnings are expected until proper fix is applied"
              true  # Don't fail the build
            }
          else
            echo "❌ Library not found at $lib"
            exit 1
          fi
      
      - name: Upload Android artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v6
        with:
          name: android-lib-${{ matrix.arch }}
          path: android/src/main/jniLibs/${{ matrix.arch }}/libnavia_core.so
          retention-days: 7

  # Collect Android artifacts and build final AAR
  android-package:
    name: Android Package & Test
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64
    needs: [changes, android-build]
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.android == 'true' || needs.changes.outputs.workflows == 'true') && !cancelled() && !failure()
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Rust Environment
        uses: ./.github/actions/setup-rust-env
        env:
          GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
        with:
          targets: aarch64-linux-android x86_64-linux-android
      
      - name: Setup Android Environment
        uses: ./.github/actions/setup-android-env
      
      - name: Download Android artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: android-lib-*
          path: ./android-libs/
      
      - name: Setup Android library structure
        run: |
          # Create directory structure
          mkdir -p android/src/main/jniLibs/arm64-v8a
          mkdir -p android/src/main/jniLibs/x86_64
          
          # Copy artifacts to correct locations
          find android-libs -name "libnavia_core.so" | while read lib; do
            if [[ "$lib" == *"arm64-v8a"* ]]; then
              cp "$lib" android/src/main/jniLibs/arm64-v8a/
            elif [[ "$lib" == *"x86_64"* ]]; then
              cp "$lib" android/src/main/jniLibs/x86_64/
            fi
          done
          
          # Verify libraries are in place
          ls -la android/src/main/jniLibs/*/
          
          # Both ABIs must be present before the AAR is assembled
          for abi in arm64-v8a x86_64; do
            if [ ! -f "android/src/main/jniLibs/$abi/libnavia_core.so" ]; then
              echo "::error::libnavia_core.so for $abi is missing from the android-lib-* artifacts"
              exit 1
            fi
          done
      
      - name: Build Android AAR (AAR only, libraries already built)
        run: |
          cd android
          # Skip Rust build since we have pre-built libraries
          ./gradlew assembleRelease -x buildRustLibraries --no-daemon
          # Ensure all processes complete
          sleep 5
      
      - name: Upload final Android artifacts
        uses: actions/upload-artifact@v6
        with:
          name: android-build-artifacts
          path: |
            android/src/main/jniLibs/arm64-v8a/libnavia_core.so
            android/src/main/jniLibs/x86_64/libnavia_core.so
            android/build/outputs/aar/android-release.aar
          retention-days: 7
      

  # Security and quality checks - can run in parallel with builds
  quality-checks:
    name: Quality Checks
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64
    needs: [changes, quick-checks]
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true') && !cancelled() && !failure()
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Rust Environment
        uses: ./.github/actions/setup-rust-env
        env:
          GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      
      - name: Install cargo-audit
        run: cargo install cargo-audit
      
      - name: Run security audit
        run: |
          cd rust
          cargo audit
      
      - name: Check documentation
        run: |
          cd rust/navia-core
          cargo doc --no-deps --all-features

