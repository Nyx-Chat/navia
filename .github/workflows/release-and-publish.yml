name: Release and Publish

on:
  push:
    branches:
      - main
    paths:
      - 'rust/navia-core/Cargo.toml'

jobs:
  release-and-publish:
    runs-on: runs-on=${{ github.run_id }}/runner=8cpu-linux-x64
    permissions:
      contents: write
      packages: write
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h
      
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure git for private repos
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"
          mkdir -p ~/.cargo
          echo "[net]" >> ~/.cargo/config.toml
          echo "git-fetch-with-cli = true" >> ~/.cargo/config.toml

      - name: Get version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep -E '^version = ' rust/navia-core/Cargo.toml | cut -d'"' -f2)
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT
          echo "RAW_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: v$VERSION"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.get_version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.get_version.outputs.VERSION }} already exists"
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.get_version.outputs.VERSION }} does not exist"
          fi

      - name: Setup Rust
        if: steps.check_tag.outputs.EXISTS == 'false'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Add Android targets (needed for Cargo.lock)
        if: steps.check_tag.outputs.EXISTS == 'false'
        run: rustup target add aarch64-linux-android x86_64-linux-android

      # Skip tests - they already passed in PR validation
      - name: Build release
        if: steps.check_tag.outputs.EXISTS == 'false'
        working-directory: rust
        run: |
          cargo build --release

      - name: Create and push tag
        if: steps.check_tag.outputs.EXISTS == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create annotated tag with commit message as annotation
          COMMIT_MSG=$(git log -1 --pretty=%B)
          git tag -a "${{ steps.get_version.outputs.VERSION }}" -m "$COMMIT_MSG"
          
          git push origin "${{ steps.get_version.outputs.VERSION }}"
          
          echo "✅ Created and pushed tag ${{ steps.get_version.outputs.VERSION }}"

      - name: Build release artifacts
        if: steps.check_tag.outputs.EXISTS == 'false'
        working-directory: rust
        run: |
          # Build for multiple targets if needed
          cargo build --release --target x86_64-unknown-linux-gnu
          
          # Create artifacts directory
          mkdir -p ../artifacts
          
          # Copy built artifacts
          cp target/x86_64-unknown-linux-gnu/release/libnavia_core.so ../artifacts/ || true
          cp target/x86_64-unknown-linux-gnu/release/libnavia_core.a ../artifacts/ || true
          
          # Note: Kotlin bindings are generated during Android build process
          
          # Create archive
          cd ../artifacts
          tar -czf navia-core-${{ steps.get_version.outputs.RAW_VERSION }}.tar.gz *

      - name: Create GitHub Release
        if: steps.check_tag.outputs.EXISTS == 'false'
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          release_name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## Changes in this release
            
            ${{ github.event.head_commit.message }}
            
            ### Installation
            
            #### Android
            Add to your project's `build.gradle`:
            ```gradle
            implementation 'com.github.nyx-chat:navia:${{ steps.get_version.outputs.RAW_VERSION }}'
            ```
            
            ---
            *This release was automatically created when the version was bumped in Cargo.toml*
          draft: false
          prerelease: false

      - name: Upload Release Assets
        if: steps.check_tag.outputs.EXISTS == 'false'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/navia-core-${{ steps.get_version.outputs.RAW_VERSION }}.tar.gz
          asset_name: navia-core-${{ steps.get_version.outputs.RAW_VERSION }}.tar.gz
          asset_content_type: application/gzip

      # Android build and publish
      - name: Setup JDK
        if: steps.check_tag.outputs.EXISTS == 'false'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        if: steps.check_tag.outputs.EXISTS == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      
      - name: Setup Android SDK
        if: steps.check_tag.outputs.EXISTS == 'false'
        uses: android-actions/setup-android@v3
      
      - name: Install Android SDK build-tools
        if: steps.check_tag.outputs.EXISTS == 'false'
        run: |
          sdkmanager --install "build-tools;34.0.0"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Setup Android NDK
        if: steps.check_tag.outputs.EXISTS == 'false'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
        id: setup-ndk
      
      - name: Set Android NDK environment
        if: steps.check_tag.outputs.EXISTS == 'false'
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      # Build tools are included in the NDK
      # Note: Android targets already added earlier

      - name: Clean up before Android build
        if: steps.check_tag.outputs.EXISTS == 'false'
        run: |
          # Remove Linux build artifacts to free space
          rm -rf rust/target/release
          rm -rf rust/target/x86_64-unknown-linux-gnu
          df -h

      - name: Build Rust libraries for Android
        if: steps.check_tag.outputs.EXISTS == 'false'
        env:
          # Ensure 16KB alignment flags are applied
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=4096 -C link-arg=-Wl,-z,separate-code -C link-arg=-Wl,-z,separate-loadable-segments"
        run: |
          cd scripts
          ./build-for-android.sh --package
          
      - name: Verify 16KB alignment
        if: steps.check_tag.outputs.EXISTS == 'false'
        run: |
          echo "Verifying 16KB alignment for Android 15+ compatibility..."
          ./scripts/verify-16kb-alignment.sh android/src/main/jniLibs/arm64-v8a/libnavia_core.so

      - name: Build and publish Android AAR
        if: steps.check_tag.outputs.EXISTS == 'false'
        run: |
          cd android
          ./gradlew publish -PVERSION_NAME=${{ steps.get_version.outputs.RAW_VERSION }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}