name: Release and Publish

on:
  push:
    branches:
      - main
    paths:
      - 'rust/navia-core/Cargo.toml'

jobs:
  release-and-publish:
    runs-on: runs-on=${{ github.run_id }}/runner=8cpu-linux-x64
    permissions:
      contents: write
      packages: write
      actions: read
      pull-requests: read
    outputs:
      tag_created: ${{ steps.check_tag.outputs.EXISTS == 'false' }}
      validation_run_id: ${{ steps.validation_run.outputs.RUN_ID }}
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h
      
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Rust Environment
        uses: ./.github/actions/setup-rust-env
        env:
          GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}

      - name: Get version from Cargo.toml
        id: get_version
        run: |
          # Verify Cargo.lock exists
          if [ ! -f rust/Cargo.lock ]; then
            echo "❌ ERROR: rust/Cargo.lock not found - run 'cargo build' locally first"
            exit 1
          fi
          
          VERSION=$(grep -E '^version = ' rust/navia-core/Cargo.toml | cut -d'"' -f2)
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT
          echo "RAW_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: v$VERSION"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.get_version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
            echo "⚠️  Tag ${{ steps.get_version.outputs.VERSION }} already exists - skipping release"
            echo "If you need to re-release, delete the tag first with:"
            echo "  git tag -d ${{ steps.get_version.outputs.VERSION }}"
            echo "  git push origin :refs/tags/${{ steps.get_version.outputs.VERSION }}"
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
            echo "✅ Tag ${{ steps.get_version.outputs.VERSION }} does not exist - proceeding with release"
          fi

      # The binaries this release publishes are the ones PR Validation built for
      # the pull request that produced this push, never those of whichever
      # validation run finished last: another PR validated after this one would
      # otherwise ship its code under this version. This runs before the tag is
      # pushed, and checks the iOS artifact too, so a miss fails the release
      # before anything is published.
      - name: Find the release PR's validation run
        if: steps.check_tag.outputs.EXISTS == 'false'
        id: validation_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          fail() {
            echo "::error title=No PR Validation artifacts for this release::$1"
            exit 1
          }
          for tool in gh jq; do
            command -v "$tool" >/dev/null || fail "$tool is not installed on this runner."
          done

          # The merged PR whose merge commit is this push's head (merge, squash
          # and rebase merges all set merge_commit_sha to it).
          PULLS=$(gh api "repos/$REPO/commits/$RELEASE_SHA/pulls") \
            || fail "Could not list the pull requests of $RELEASE_SHA."
          PR=$(jq -r --arg sha "$RELEASE_SHA" '
            [ .[] | select(.merged_at != null and .merge_commit_sha == $sha) ]
            | if length == 1 then "\(.[0].number) \(.[0].head.sha)" else empty end' <<< "$PULLS")
          if [ -z "$PR" ]; then
            fail "$RELEASE_SHA is not the merge commit of exactly one merged pull request, so no PR Validation run built its binaries. Merge the release commit to main through a pull request whose PR Validation run passed."
          fi
          PR_NUMBER=${PR%% *}
          PR_HEAD_SHA=${PR#* }
          echo "Release commit $RELEASE_SHA comes from PR #$PR_NUMBER (head $PR_HEAD_SHA)"

          # Successful PR Validation runs for that head, newest first; take the
          # first that still holds every artifact this workflow downloads.
          RUNS=$(gh api -X GET "repos/$REPO/actions/workflows/pr-validation.yml/runs" \
            -f head_sha="$PR_HEAD_SHA" -f event=pull_request -f status=success -f per_page=100) \
            || fail "Could not list the PR Validation runs of PR #$PR_NUMBER."
          RUN_ID=""
          for id in $(jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[].id' <<< "$RUNS"); do
            ARTIFACTS=$(gh api "repos/$REPO/actions/runs/$id/artifacts?per_page=100") \
              || fail "Could not list the artifacts of PR Validation run $id."
            if jq -e '
              [ .artifacts[] | select(.expired == false) | .name ] as $names
              | all("android-lib-arm64-v8a", "android-lib-x86_64", "navia-ios-spm";
                    . as $want | any($names[]; . == $want))' <<< "$ARTIFACTS" >/dev/null; then
              RUN_ID=$id
              break
            fi
            echo "PR Validation run $id lacks an unexpired android-lib-arm64-v8a, android-lib-x86_64 or navia-ios-spm artifact"
          done
          if [ -z "$RUN_ID" ]; then
            fail "PR #$PR_NUMBER has no successful PR Validation run for its head $PR_HEAD_SHA that still holds android-lib-arm64-v8a, android-lib-x86_64 and navia-ios-spm (they are kept 7 days). Re-run all jobs of that PR's PR Validation run from the Actions tab, wait for it to pass, then re-run this workflow. No tag was pushed and nothing was published."
          fi
          echo "Using PR Validation run $RUN_ID: https://github.com/$REPO/actions/runs/$RUN_ID"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download Android artifacts from PR validation
        if: steps.check_tag.outputs.EXISTS == 'false'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: pr-validation.yml
          run_id: ${{ steps.validation_run.outputs.RUN_ID }}
          name: android-lib-.*
          name_is_regexp: true
          path: ./android-artifacts/
          if_no_artifact_found: fail

      - name: Setup Android Environment
        if: steps.check_tag.outputs.EXISTS == 'false'
        uses: ./.github/actions/setup-android-env

      - name: Setup Android artifacts and build AAR (minimal)
        if: steps.check_tag.outputs.EXISTS == 'false'
        run: |
          # Debug: Check what was actually downloaded
          echo "=== Downloaded artifacts structure ==="
          find android-artifacts -type f -name "*.so" | head -20
          ls -la android-artifacts/ || true
          
          # Create directory structure
          mkdir -p android/src/main/jniLibs/arm64-v8a
          mkdir -p android/src/main/jniLibs/x86_64
          
          # Copy individual matrix artifacts to correct locations
          find android-artifacts -name "libnavia_core.so" | while read lib; do
            echo "Found library: $lib"
            if [[ "$lib" == *"arm64-v8a"* ]]; then
              echo "Copying to arm64-v8a..."
              cp "$lib" android/src/main/jniLibs/arm64-v8a/
            elif [[ "$lib" == *"x86_64"* ]]; then
              echo "Copying to x86_64..."
              cp "$lib" android/src/main/jniLibs/x86_64/
            fi
          done
          
          # Verify libraries are in place
          echo "=== Libraries after setup ==="
          ls -la android/src/main/jniLibs/*/
          
          # Build ONLY the AAR with pre-built libraries (skip Rust entirely)
          cd android
          ./gradlew assembleRelease -x buildRustLibraries --no-daemon --quiet
          cd ..
          
          echo "✅ Android artifacts positioned and minimal AAR built"

      - name: Create and push tag
        if: steps.check_tag.outputs.EXISTS == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create annotated tag with commit message as annotation
          COMMIT_MSG=$(git log -1 --pretty=%B)
          git tag -a "${{ steps.get_version.outputs.VERSION }}" -m "$COMMIT_MSG"
          
          git push origin "${{ steps.get_version.outputs.VERSION }}"
          
          echo "✅ Created and pushed tag ${{ steps.get_version.outputs.VERSION }}"

      - name: Build release artifacts
        if: steps.check_tag.outputs.EXISTS == 'false'
        run: |
          # Create artifacts directory and use cached Android artifacts
          mkdir -p artifacts
          
          # Copy Android artifacts to release directory  
          cp android/src/main/jniLibs/arm64-v8a/libnavia_core.so artifacts/ || true
          cp android/src/main/jniLibs/x86_64/libnavia_core.so artifacts/libnavia_core_x86_64.so || true
          
          # Create archive
          cd artifacts
          tar -czf navia-core-${{ steps.get_version.outputs.RAW_VERSION }}.tar.gz *

      - name: Create GitHub Release
        if: steps.check_tag.outputs.EXISTS == 'false'
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## Changes in this release
            
            ${{ github.event.head_commit.message }}
            
            ### Installation
            
            #### Android
            Add to your module's `build.gradle.kts`:
            ```kotlin
            dependencies {
                implementation("com.nyx:navia:${{ steps.get_version.outputs.RAW_VERSION }}")
                implementation("net.java.dev.jna:jna:5.17.0@aar")
            }
            ```

            Navia is published to GitHub Packages, so your Gradle repositories need `https://maven.pkg.github.com/Nyx-Chat/navia` with a GitHub user and a token that has the `read:packages` scope (see [Troubleshooting](https://github.com/Nyx-Chat/navia/blob/${{ steps.get_version.outputs.VERSION }}/docs/TROUBLESHOOTING.md#failed-to-resolve-comnyxnaviaxxx)).
            
            #### iOS
            
            Swift Package Manager, iOS 17.0+ (`arm64` devices and Apple Silicon simulators). The release assets hold `navia_coreFFI.xcframework-${{ steps.get_version.outputs.RAW_VERSION }}.zip` (the static XCFramework), its SwiftPM checksum `navia_coreFFI.xcframework-${{ steps.get_version.outputs.RAW_VERSION }}.zip.checksum`, and `navia_core-${{ steps.get_version.outputs.RAW_VERSION }}.swift`, the Swift bindings generated from the same build. Use the zip and the Swift file of one release together; [Installation in the iOS Integration Guide](https://github.com/Nyx-Chat/navia/blob/${{ steps.get_version.outputs.VERSION }}/docs/IOS_INTEGRATION.md#installation) shows the package that wraps them.
            
            ---
            *This release was automatically created when the version was bumped in Cargo.toml*
          draft: false
          prerelease: false
          files: ./artifacts/navia-core-${{ steps.get_version.outputs.RAW_VERSION }}.tar.gz

      # Android publish using cached artifacts
      - name: Setup Android Environment  
        if: steps.check_tag.outputs.EXISTS == 'false'
        uses: ./.github/actions/setup-android-env

      - name: Verify 16KB alignment
        if: steps.check_tag.outputs.EXISTS == 'false'
        run: |
          echo "Verifying 16KB alignment for Android 15+ compatibility..."
          ./scripts/verify-16kb-alignment.sh android/src/main/jniLibs/arm64-v8a/libnavia_core.so

      - name: Publish Android AAR using cached artifacts
        if: steps.check_tag.outputs.EXISTS == 'false'
        run: |
          cd android
          ./gradlew publish -PVERSION_NAME=${{ steps.get_version.outputs.RAW_VERSION }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # iOS assets: the static navia_coreFFI.xcframework zip, its SwiftPM checksum
  # and the Swift bindings generated from the same build
  ios-release:
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64
    needs: release-and-publish
    if: needs.release-and-publish.outputs.tag_created == 'true'
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep -E '^version = ' rust/navia-core/Cargo.toml | cut -d'"' -f2)
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT
          echo "RAW_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: v$VERSION"

      # The same PR Validation run the Android binaries came from; the
      # release-and-publish job picked it and checked this artifact exists.
      - name: Download navia-ios-spm from PR validation
        if: needs.release-and-publish.outputs.tag_created == 'true'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: pr-validation.yml
          run_id: ${{ needs.release-and-publish.outputs.validation_run_id }}
          name: navia-ios-spm
          path: ./ios-artifacts/
          if_no_artifact_found: fail

      - name: Stage the iOS release assets
        if: needs.release-and-publish.outputs.tag_created == 'true'
        env:
          RAW_VERSION: ${{ steps.get_version.outputs.RAW_VERSION }}
        run: |
          fail() {
            echo "::error title=Incomplete navia-ios-spm artifact::$1"
            exit 1
          }
          for name in navia_coreFFI.xcframework.zip navia_coreFFI.xcframework.zip.checksum navia_core.swift; do
            COUNT=$(find ios-artifacts -type f -name "$name" | grep -c . || true)
            [ "$COUNT" = 1 ] || fail "navia-ios-spm holds $COUNT files named $name, expected 1."
          done
          ZIP=$(find ios-artifacts -type f -name navia_coreFFI.xcframework.zip)
          CHECKSUM=$(find ios-artifacts -type f -name navia_coreFFI.xcframework.zip.checksum)
          SWIFT=$(find ios-artifacts -type f -name navia_core.swift)

          # The SwiftPM checksum of a binary target is the SHA-256 of its zip.
          if [ "$(sha256sum "$ZIP" | cut -d' ' -f1)" != "$(tr -d '[:space:]' < "$CHECKSUM")" ]; then
            fail "navia_coreFFI.xcframework.zip.checksum does not match the zip."
          fi

          mkdir -p ios-release
          cp "$ZIP" "ios-release/navia_coreFFI.xcframework-$RAW_VERSION.zip"
          cp "$CHECKSUM" "ios-release/navia_coreFFI.xcframework-$RAW_VERSION.zip.checksum"
          cp "$SWIFT" "ios-release/navia_core-$RAW_VERSION.swift"
          ls -la ios-release

      - name: Upload the iOS assets to the release
        if: needs.release-and-publish.outputs.tag_created == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          fail_on_unmatched_files: true
          files: |
            ./ios-release/navia_coreFFI.xcframework-${{ steps.get_version.outputs.RAW_VERSION }}.zip
            ./ios-release/navia_coreFFI.xcframework-${{ steps.get_version.outputs.RAW_VERSION }}.zip.checksum
            ./ios-release/navia_core-${{ steps.get_version.outputs.RAW_VERSION }}.swift
