name: Release and Publish

on:
  push:
    branches:
      - main
    paths:
      - 'rust/navia-core/Cargo.toml'

jobs:
  release-and-publish:
    runs-on: runs-on=${{ github.run_id }}/runner=8cpu-linux-x64
    permissions:
      contents: write
      packages: write
      actions: read
    outputs:
      tag_created: ${{ steps.check_tag.outputs.EXISTS == 'false' }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h
      
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Rust Environment
        uses: ./.github/actions/setup-rust-env
        env:
          GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}

      - name: Get version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep -E '^version = ' rust/navia-core/Cargo.toml | cut -d'"' -f2)
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT
          echo "RAW_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: v$VERSION"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.get_version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.get_version.outputs.VERSION }} already exists"
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.get_version.outputs.VERSION }} does not exist"
          fi

      - name: Download Android artifacts from PR validation
        if: steps.check_tag.outputs.EXISTS == 'false'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: pr-validation.yml
          workflow_conclusion: success
          name: android-build-artifacts
          path: ./android-artifacts/

      - name: Setup Android artifacts
        if: steps.check_tag.outputs.EXISTS == 'false'
        run: |
          # Create directory structure and copy artifacts
          mkdir -p android/src/main/jniLibs/arm64-v8a
          mkdir -p android/src/main/jniLibs/x86_64
          mkdir -p android/build/outputs/aar
          
          # Copy artifacts to expected locations
          cp android-artifacts/android/src/main/jniLibs/arm64-v8a/libnavia_core.so android/src/main/jniLibs/arm64-v8a/
          cp android-artifacts/android/src/main/jniLibs/x86_64/libnavia_core.so android/src/main/jniLibs/x86_64/
          cp android-artifacts/android/build/outputs/aar/android-release.aar android/build/outputs/aar/
          
          echo "✅ Android artifacts downloaded and positioned"

      - name: Create and push tag
        if: steps.check_tag.outputs.EXISTS == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create annotated tag with commit message as annotation
          COMMIT_MSG=$(git log -1 --pretty=%B)
          git tag -a "${{ steps.get_version.outputs.VERSION }}" -m "$COMMIT_MSG"
          
          git push origin "${{ steps.get_version.outputs.VERSION }}"
          
          echo "✅ Created and pushed tag ${{ steps.get_version.outputs.VERSION }}"

      - name: Build release artifacts
        if: steps.check_tag.outputs.EXISTS == 'false'
        run: |
          # Create artifacts directory and use cached Android artifacts
          mkdir -p artifacts
          
          # Copy Android artifacts to release directory  
          cp android/src/main/jniLibs/arm64-v8a/libnavia_core.so artifacts/ || true
          cp android/src/main/jniLibs/x86_64/libnavia_core.so artifacts/libnavia_core_x86_64.so || true
          
          # Create archive
          cd artifacts
          tar -czf navia-core-${{ steps.get_version.outputs.RAW_VERSION }}.tar.gz *

      - name: Create GitHub Release
        if: steps.check_tag.outputs.EXISTS == 'false'
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          release_name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## Changes in this release
            
            ${{ github.event.head_commit.message }}
            
            ### Installation
            
            #### Android
            Add to your project's `build.gradle`:
            ```gradle
            implementation 'com.github.nyx-chat:navia:${{ steps.get_version.outputs.RAW_VERSION }}'
            ```
            
            #### iOS
            
            **CocoaPods:**
            Add to your `Podfile`:
            ```ruby
            pod 'Navia', :git => 'https://github.com/Nyx-Chat/navia.git', :tag => '${{ steps.get_version.outputs.VERSION }}'
            ```
            
            **Swift Package Manager:**
            Add to your `Package.swift`:
            ```swift
            .package(url: "https://github.com/Nyx-Chat/navia.git", .exact("${{ steps.get_version.outputs.RAW_VERSION }}"))
            ```
            
            **XCFramework (Manual):**
            Download and drag `Navia.xcframework` from the release assets into your Xcode project.
            
            ---
            *This release was automatically created when the version was bumped in Cargo.toml*
          draft: false
          prerelease: false

      - name: Upload Release Assets
        if: steps.check_tag.outputs.EXISTS == 'false'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/navia-core-${{ steps.get_version.outputs.RAW_VERSION }}.tar.gz
          asset_name: navia-core-${{ steps.get_version.outputs.RAW_VERSION }}.tar.gz
          asset_content_type: application/gzip

      # Android publish using cached artifacts
      - name: Setup Android Environment  
        if: steps.check_tag.outputs.EXISTS == 'false'
        uses: ./.github/actions/setup-android-env

      - name: Verify 16KB alignment
        if: steps.check_tag.outputs.EXISTS == 'false'
        run: |
          echo "Verifying 16KB alignment for Android 15+ compatibility..."
          ./scripts/verify-16kb-alignment.sh android/src/main/jniLibs/arm64-v8a/libnavia_core.so

      - name: Publish Android AAR using cached artifacts
        if: steps.check_tag.outputs.EXISTS == 'false'
        run: |
          cd android
          ./gradlew publish -PVERSION_NAME=${{ steps.get_version.outputs.RAW_VERSION }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # iOS build and framework creation
  ios-release:
    runs-on: macos-15
    needs: release-and-publish
    if: needs.release-and-publish.outputs.tag_created == 'true'
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep -E '^version = ' rust/navia-core/Cargo.toml | cut -d'"' -f2)
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT
          echo "RAW_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: v$VERSION"

      - name: Download iOS artifacts from PR validation
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: pr-validation.yml
          workflow_conclusion: success
          name: ios-build-artifacts
          path: ./ios-artifacts/

      - name: Setup iOS artifacts
        run: |
          # Create directory structure
          mkdir -p rust/target/aarch64-apple-ios/release
          mkdir -p rust/target/aarch64-apple-ios-sim/release
          mkdir -p ios/build/DerivedData/Build/Products/Release-iphoneos
          mkdir -p ios/build/DerivedData/Build/Products/Release-iphonesimulator
          
          # Copy Rust library artifacts
          cp ios-artifacts/rust/target/aarch64-apple-ios/release/libnavia_core.a rust/target/aarch64-apple-ios/release/
          cp ios-artifacts/rust/target/aarch64-apple-ios-sim/release/libnavia_core.a rust/target/aarch64-apple-ios-sim/release/
          
          # Copy iOS framework artifacts
          cp -r ios-artifacts/ios/build/DerivedData/Build/Products/Release-iphoneos/Navia.framework ios/build/DerivedData/Build/Products/Release-iphoneos/
          cp -r ios-artifacts/ios/build/DerivedData/Build/Products/Release-iphonesimulator/Navia.framework ios/build/DerivedData/Build/Products/Release-iphonesimulator/
          
          echo "✅ iOS artifacts downloaded and positioned"

      - name: Create XCFramework
        run: |
          cd ios
          
          # Verify framework paths exist
          ls -la build/DerivedData/Build/Products/Release-iphoneos/ || echo "Device build not found"
          ls -la build/DerivedData/Build/Products/Release-iphonesimulator/ || echo "Simulator build not found"
          
          # Create XCFramework combining device and simulator builds
          xcodebuild -create-xcframework \
            -framework build/DerivedData/Build/Products/Release-iphoneos/Navia.framework \
            -framework build/DerivedData/Build/Products/Release-iphonesimulator/Navia.framework \
            -output Navia.xcframework
          
          # Archive the XCFramework
          zip -r Navia.xcframework-${{ steps.get_version.outputs.RAW_VERSION }}.zip Navia.xcframework

      - name: Upload iOS XCFramework to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release-and-publish.outputs.upload_url }}
          asset_path: ./ios/Navia.xcframework-${{ steps.get_version.outputs.RAW_VERSION }}.zip
          asset_name: Navia.xcframework-${{ steps.get_version.outputs.RAW_VERSION }}.zip
          asset_content_type: application/zip

      - name: Update Podspec version and push
        run: |
          # Update the podspec version to match Cargo.toml
          sed -i '' "s/spec.version.*=.*/spec.version       = \"${{ steps.get_version.outputs.RAW_VERSION }}\"/" Navia.podspec
          
          # Commit and push the podspec change
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Navia.podspec
          git commit -m "Update Podspec to version ${{ steps.get_version.outputs.RAW_VERSION }}"
          git push origin main