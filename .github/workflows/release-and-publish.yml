name: Release and Publish

on:
  push:
    branches:
      - main
    paths:
      - 'rust/navia-core/Cargo.toml'

jobs:
  release-and-publish:
    runs-on: runs-on=${{ github.run_id }}/runner=8cpu-linux-x64
    permissions:
      contents: write
      packages: write
      actions: read
    outputs:
      tag_created: ${{ steps.check_tag.outputs.EXISTS == 'false' }}
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h
      
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Rust Environment
        uses: ./.github/actions/setup-rust-env
        env:
          GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}

      - name: Get version from Cargo.toml
        id: get_version
        run: |
          # Verify Cargo.lock exists
          if [ ! -f rust/Cargo.lock ]; then
            echo "❌ ERROR: rust/Cargo.lock not found - run 'cargo build' locally first"
            exit 1
          fi
          
          VERSION=$(grep -E '^version = ' rust/navia-core/Cargo.toml | cut -d'"' -f2)
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT
          echo "RAW_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: v$VERSION"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.get_version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
            echo "⚠️  Tag ${{ steps.get_version.outputs.VERSION }} already exists - skipping release"
            echo "If you need to re-release, delete the tag first with:"
            echo "  git tag -d ${{ steps.get_version.outputs.VERSION }}"
            echo "  git push origin :refs/tags/${{ steps.get_version.outputs.VERSION }}"
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
            echo "✅ Tag ${{ steps.get_version.outputs.VERSION }} does not exist - proceeding with release"
          fi

      - name: Download Android artifacts from PR validation
        if: steps.check_tag.outputs.EXISTS == 'false'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: pr-validation.yml
          workflow_conclusion: success
          pattern: android-lib-*
          path: ./android-artifacts/

      - name: Setup Android Environment
        if: steps.check_tag.outputs.EXISTS == 'false'
        uses: ./.github/actions/setup-android-env

      - name: Setup Android artifacts and build AAR (minimal)
        if: steps.check_tag.outputs.EXISTS == 'false'
        run: |
          # Debug: Check what was actually downloaded
          echo "=== Downloaded artifacts structure ==="
          find android-artifacts -type f -name "*.so" | head -20
          ls -la android-artifacts/ || true
          
          # Create directory structure
          mkdir -p android/src/main/jniLibs/arm64-v8a
          mkdir -p android/src/main/jniLibs/x86_64
          
          # Copy individual matrix artifacts to correct locations
          find android-artifacts -name "libnavia_core.so" | while read lib; do
            echo "Found library: $lib"
            if [[ "$lib" == *"arm64-v8a"* ]]; then
              echo "Copying to arm64-v8a..."
              cp "$lib" android/src/main/jniLibs/arm64-v8a/
            elif [[ "$lib" == *"x86_64"* ]]; then
              echo "Copying to x86_64..."
              cp "$lib" android/src/main/jniLibs/x86_64/
            fi
          done
          
          # Verify libraries are in place
          echo "=== Libraries after setup ==="
          ls -la android/src/main/jniLibs/*/
          
          # Build ONLY the AAR with pre-built libraries (skip Rust entirely)
          cd android
          ./gradlew assembleRelease -x buildRustLibraries --no-daemon --quiet
          cd ..
          
          echo "✅ Android artifacts positioned and minimal AAR built"

      - name: Create and push tag
        if: steps.check_tag.outputs.EXISTS == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create annotated tag with commit message as annotation
          COMMIT_MSG=$(git log -1 --pretty=%B)
          git tag -a "${{ steps.get_version.outputs.VERSION }}" -m "$COMMIT_MSG"
          
          git push origin "${{ steps.get_version.outputs.VERSION }}"
          
          echo "✅ Created and pushed tag ${{ steps.get_version.outputs.VERSION }}"

      - name: Build release artifacts
        if: steps.check_tag.outputs.EXISTS == 'false'
        run: |
          # Create artifacts directory and use cached Android artifacts
          mkdir -p artifacts
          
          # Copy Android artifacts to release directory  
          cp android/src/main/jniLibs/arm64-v8a/libnavia_core.so artifacts/ || true
          cp android/src/main/jniLibs/x86_64/libnavia_core.so artifacts/libnavia_core_x86_64.so || true
          
          # Create archive
          cd artifacts
          tar -czf navia-core-${{ steps.get_version.outputs.RAW_VERSION }}.tar.gz *

      - name: Create GitHub Release
        if: steps.check_tag.outputs.EXISTS == 'false'
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## Changes in this release
            
            ${{ github.event.head_commit.message }}
            
            ### Installation
            
            #### Android
            Add to your project's `build.gradle`:
            ```gradle
            implementation 'com.github.nyx-chat:navia:${{ steps.get_version.outputs.RAW_VERSION }}'
            ```
            
            #### iOS
            
            **CocoaPods:**
            Add to your `Podfile`:
            ```ruby
            pod 'Navia', :git => 'https://github.com/Nyx-Chat/navia.git', :tag => '${{ steps.get_version.outputs.VERSION }}'
            ```
            
            **Swift Package Manager:**
            Add to your `Package.swift`:
            ```swift
            .package(url: "https://github.com/Nyx-Chat/navia.git", .exact("${{ steps.get_version.outputs.RAW_VERSION }}"))
            ```
            
            **XCFramework (Manual):**
            Download and drag `Navia.xcframework` from the release assets into your Xcode project.
            
            ---
            *This release was automatically created when the version was bumped in Cargo.toml*
          draft: false
          prerelease: false
          files: ./artifacts/navia-core-${{ steps.get_version.outputs.RAW_VERSION }}.tar.gz

      # Android publish using cached artifacts
      - name: Setup Android Environment  
        if: steps.check_tag.outputs.EXISTS == 'false'
        uses: ./.github/actions/setup-android-env

      - name: Verify 16KB alignment
        if: steps.check_tag.outputs.EXISTS == 'false'
        run: |
          echo "Verifying 16KB alignment for Android 15+ compatibility..."
          ./scripts/verify-16kb-alignment.sh android/src/main/jniLibs/arm64-v8a/libnavia_core.so

      - name: Publish Android AAR using cached artifacts
        if: steps.check_tag.outputs.EXISTS == 'false'
        run: |
          cd android
          ./gradlew publish -PVERSION_NAME=${{ steps.get_version.outputs.RAW_VERSION }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # iOS build and framework creation
  ios-release:
    runs-on: macos-15
    needs: release-and-publish
    if: needs.release-and-publish.outputs.tag_created == 'true'
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep -E '^version = ' rust/navia-core/Cargo.toml | cut -d'"' -f2)
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT
          echo "RAW_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: v$VERSION"

      - name: Download iOS artifacts from PR validation
        if: needs.release-and-publish.outputs.tag_created == 'true'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: pr-validation.yml
          workflow_conclusion: success
          name: ios-build-artifacts
          path: ./ios-artifacts/

      - name: Setup iOS artifacts
        if: needs.release-and-publish.outputs.tag_created == 'true'
        run: |
          # Debug: Check what was actually downloaded
          echo "=== Downloaded iOS artifacts structure ==="
          find ios-artifacts -type f -name "*.a" -o -name "*.framework" | head -20
          ls -la ios-artifacts/ || true
          
          # Create directory structure
          mkdir -p rust/target/aarch64-apple-ios/release
          mkdir -p rust/target/aarch64-apple-ios-sim/release
          mkdir -p ios/build/DerivedData/Build/Products/Release-iphoneos
          mkdir -p ios/build/DerivedData/Build/Products/Release-iphonesimulator
          
          # Copy Rust library artifacts with enhanced fallback search
          find ios-artifacts -name "libnavia_core.a" | while read lib; do
            echo "Found library: $lib"
            if [[ "$lib" == *"aarch64-apple-ios-sim"* ]]; then
              echo "Copying to iOS simulator target..."
              cp "$lib" rust/target/aarch64-apple-ios-sim/release/
            elif [[ "$lib" == *"aarch64-apple-ios"* ]]; then
              echo "Copying to iOS device target..."
              cp "$lib" rust/target/aarch64-apple-ios/release/
            fi
          done
          
          # Copy iOS framework artifacts with enhanced fallback search
          find ios-artifacts -name "Navia.framework" | while read framework; do
            echo "Found framework: $framework"
            if [[ "$framework" == *"Release-iphoneos"* ]]; then
              echo "Copying to iOS device framework..."
              cp -r "$framework" ios/build/DerivedData/Build/Products/Release-iphoneos/
            elif [[ "$framework" == *"Release-iphonesimulator"* ]]; then
              echo "Copying to iOS simulator framework..."
              cp -r "$framework" ios/build/DerivedData/Build/Products/Release-iphonesimulator/
            fi
          done
          
          # Verify artifacts are in place
          echo "=== Rust libraries after setup ==="
          ls -la rust/target/*/release/ || echo "No Rust libraries found"
          echo "=== iOS frameworks after setup ==="
          ls -la ios/build/DerivedData/Build/Products/*/ || echo "No iOS frameworks found"
          
          echo "✅ iOS artifacts downloaded and positioned"

      - name: Create XCFramework
        if: needs.release-and-publish.outputs.tag_created == 'true'
        run: |
          cd ios
          
          # Verify framework paths exist
          ls -la build/DerivedData/Build/Products/Release-iphoneos/ || echo "Device build not found"
          ls -la build/DerivedData/Build/Products/Release-iphonesimulator/ || echo "Simulator build not found"
          
          # Create XCFramework combining device and simulator builds
          xcodebuild -create-xcframework \
            -framework build/DerivedData/Build/Products/Release-iphoneos/Navia.framework \
            -framework build/DerivedData/Build/Products/Release-iphonesimulator/Navia.framework \
            -output Navia.xcframework
          
          # Archive the XCFramework
          zip -r Navia.xcframework-${{ steps.get_version.outputs.RAW_VERSION }}.zip Navia.xcframework

      - name: Upload iOS XCFramework to Release
        if: needs.release-and-publish.outputs.tag_created == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          files: ./ios/Navia.xcframework-${{ steps.get_version.outputs.RAW_VERSION }}.zip

